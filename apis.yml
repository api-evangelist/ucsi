    UCSI's own hosts cannot be read by any automated client. Every probe against ucsiuniversity.edu.my
    and its subdomains on 2026-09-01 returned HTTP 403 from Cloudflare — with a plain client and again
    with a full Chrome User-Agent, Accept, Accept-Language and Upgrade-Insecure-Requests header set —
    and the main site's response carries `cf-mitigated: challenge`. The hosts are LIVE (Google indexes
    the Koha catalogue as "UCSI University Library catalog"); they are unreadable to us. That is a
    finding about our access, not a claim that UCSI publishes nothing there, and the Koha OAI-PMH /
    ILS-DI / REST question is therefore recorded as unverifiable in conformance/ rather than as absent.
    The surfaces that COULD be read were all read off-host and are all recorded: the Entra ID identity
    tenant, the CourseNetworking LMS tenancy, the ROR registration, and the confirmed absence of
    eduGAIN/SIFULAN, Crossref and DataCite records. No contract was saved for any of them, because
    none of them is UCSI's engineering.
