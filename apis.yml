  - aid: ucsi:entra-identity-federation
    name: UCSI University Identity Federation (Microsoft Entra ID)
    x-operator: federation
    description: >-
      UCSI operates a Microsoft Entra ID tenant, 3c5f2d31-81d8-4455-a2bf-531fbc398144, region AS,
      whose FederationBrandName is "UCSI University" and whose realm for ucsiuniversity.edu.my is
      NameSpaceType "Managed" — cloud-native, not federated to an on-premises AD FS. Both its signed
      SAML 2.0 federation metadata (entityID https://sts.windows.net/3c5f2d31-81d8-4455-a2bf-531fbc398144/,
      IDPSSODescriptor, HTTP-POST and HTTP-Redirect SSO bindings, 28KB) and its OpenID Connect
      discovery document (RS256, scopes openid/profile/email/offline_access, authorization-code,
      implicit and device-code response types) are publicly retrievable, which makes this the only
      machine-readable identity surface UCSI has and the single strongest programmable surface in this
      profile. A federation is shared by definition and the IdP behind it is the institution's; the
      contract is Microsoft's and is not saved here. UCSI has NO entity in eduGAIN and none in
      Malaysia's SIFULAN federation, so Entra ID is the whole of the federation story.
    humanURL: https://www.ucsiuniversity.edu.my/
    baseURL: https://login.microsoftonline.com/3c5f2d31-81d8-4455-a2bf-531fbc398144/v2.0
