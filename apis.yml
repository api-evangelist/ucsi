      UCSI's learning management system is a tenancy on CourseNetworking (The CN): the institution
      host lms.ucsiuniversity.edu.my is a CNAME to ucsi.thecn.com and redirects there with HTTP 301,
      landing on a UCSI-branded CourseNetworking sign-in for students and staff. The tenancy is a real
