apis:
  - aid: ucsi:library-catalog
    name: UCSI University Library Catalog (Koha)
    x-operator: institution
    description: >-
      The Tan Sri Musa Mohamad Library runs a Koha open-source integrated library system whose OPAC is
      served from koha.ucsiuniversity.edu.my — UCSI's own registrable domain, so the deployment is the
      institution's even though the software is the Koha community's. The catalogue is live and
      publicly indexed (its title is "UCSI University Library catalog"), but Cloudflare answers HTTP
      403 to every automated request against the host, so none of the machine interfaces Koha can
      expose — OAI-PMH 2.0 at /cgi-bin/koha/oai.pl, ILS-DI at /cgi-bin/koha/ilsdi.pl, the REST API at
      /api/v1 — could be confirmed as enabled or as disabled. Listed as a real institution-operated
      surface whose contract is unverifiable; no OpenAPI is registered here because none was seen, and
      none was generated because generating one would credit UCSI with a document nobody has read.
    humanURL: https://koha.ucsiuniversity.edu.my/
    tags: [ Library, Library Catalog, Koha, OPAC ]
    properties:
