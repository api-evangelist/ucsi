description: >-
  UCSI University is a private, multi-campus university in Kuala Lumpur, Terengganu and Sarawak,
  Malaysia, established in 1986 and ranked #265 in the QS World University Rankings 2025. It operates
  no developer portal, no public API programme, no open data portal, no institutional repository on
  its own domain and no verifiable public code: the GitHub organisations matching "UCSI" carry no
  identifying metadata and zero public repositories. Its entire ucsiuniversity.edu.my estate — the
  main site, the library services site, the Koha catalogue, the IIS student portal, the alumni and
  mobile hosts — sits behind a Cloudflare bot-management challenge that answers HTTP 403 to every
  automated client, including one presenting full browser headers, so nothing hosted by the
  institution can be read programmatically. Three surfaces are nonetheless established off-host: a
  Microsoft Entra ID tenant (3c5f2d31-81d8-4455-a2bf-531fbc398144, branded "UCSI University") whose
  SAML 2.0 and OpenID Connect metadata are publicly retrievable and which is the institution's own
  identity provider; a CourseNetworking learning-management tenancy at ucsi.thecn.com that
  lms.ucsiuniversity.edu.my redirects into; and a ROR registration. UCSI is NOT in eduGAIN and holds
  no entity in Malaysia's SIFULAN federation, and no Crossref or DataCite membership exists under its
  name. The Koha library catalogue is institution-operated and may expose OAI-PMH, ILS-DI or REST
  services, but that cannot be confirmed through the bot challenge and is recorded as unverifiable
  rather than as either present or absent.
