  - date: '2026-09-01'
    rating: 2
    summary: >-
      Re-profiled under the API Evangelist university pipeline, which settles WHO OPERATES each surface
      before saving anything. UCSI's whole ucsiuniversity.edu.my estate is behind a Cloudflare bot
      challenge (cf-mitigated: challenge) that returns 403 to automated clients even with full browser
      headers, so no institution-hosted contract can be read — recorded as unreadable / bot_blocked
      rather than as an absence. Three surfaces were established off-host and none of them existed in
      the June 2026 profile: a Microsoft Entra ID tenant (3c5f2d31-81d8-4455-a2bf-531fbc398144, brand
      "UCSI University", Managed realm) publishing signed SAML 2.0 IdP metadata and an OIDC discovery
      document — the institution's own identity provider and its strongest programmable surface; a
      CourseNetworking LMS tenancy that lms.ucsiuniversity.edu.my 301s into at ucsi.thecn.com; and a
      ROR registration. Confirmed absences: no UCSI entity anywhere in the eduGAIN aggregate, none in
      Malaysia's SIFULAN federation, no Crossref member, no DataCite client, no verifiable official
      GitHub organisation (the "UCSI" and "UCSI-University" orgs carry no metadata and zero public
      repositories). No OpenAPI was generated for the Koha catalogue: Koha's OAI-PMH, ILS-DI and REST
      services may be enabled but nobody has read them through the challenge, and generating a contract
      would credit UCSI with a document that has never been seen.
