  - date: '2026-06-03'
    rating: 1
    summary: >-
      No public developer portal or documented APIs were found for UCSI University.
      The official website and library services site are live but WAF-protected
      (return 403 to automated requests). The library catalog runs Koha, which can
      expose OAI-PMH and ILS-DI / REST services, but no such endpoint could be
      confirmed as publicly enabled. Student portal and mobile apps exist but their
      backends are authentication-gated. No official GitHub organization was found.
      No endpoints were fabricated; only the live URLs probed are reported below.
    endpoints:
